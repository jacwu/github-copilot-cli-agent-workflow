name: ai-design

on:
  issues:
    types:
      - labeled

jobs:
  ai-design:
    if: github.event.label.name == 'ai-design'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      GITHUB_TOKEN: ${{ secrets.COPILOT_ACTION_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      REPO: ${{ github.repository }}
      FEATURE_BRANCH: feature/${{ github.event.issue.number }}
      STAGE_BRANCH: feature/${{ github.event.issue.number }}-design
      STAGE_BRANCH_URL: https://github.com/${{ github.repository }}/tree/feature/${{ github.event.issue.number }}-design
      STAGE: ai-design
      MODEL: gpt-5.4
      AGENT_FILE: ai-design
      OUTPUT_FILE: task.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Create feature branch
        run: |
          python scripts/create_branch.py "$FEATURE_BRANCH" --repo "$REPO"

      - name: Create design stage branch
        run: |
          python scripts/create_branch.py "$STAGE_BRANCH" --repo "$REPO" --source-branch "$FEATURE_BRANCH"

      - name: Comment issue start
        env:
          COMMENT_BODY: |
            **Stage: Design** has started.

            Copilot CLI is analyzing the issue and creating a technical design document.

            Model: gpt-5.4

            Branch: ${STAGE_BRANCH_URL}
        run: |
          python scripts/comment_on_issue.py "$ISSUE_NUMBER" "$COMMENT_BODY" --repo "$REPO"

      - name: Switch to design stage branch
        run: |
          git fetch origin "$STAGE_BRANCH"
          git checkout -B "$STAGE_BRANCH" "origin/$STAGE_BRANCH"

      - name: Configure git identity
        run: |
          git config user.name "GitHub Copilot CLI"
          git config user.email "cli@githubcopilot.com"

      - name: Fetch issue context
        id: issue_context
        run: |
          python scripts/fetch_issue.py "$ISSUE_NUMBER" --repo "$REPO" > issue-context.txt
          echo "Issue context fetched:"
          cat issue-context.txt

      - name: Build prompt
        id: prompt
        run: |
          STAGE_INSTRUCTION="You are in the design phase. The issue number is ${ISSUE_NUMBER}. Your only output is docs/tasks/${ISSUE_NUMBER}/task.md. Only do technical design — do not implement anything, do not modify any files outside docs/tasks/${ISSUE_NUMBER}/task.md, do not add tests, do not change configs or workflows. Stop immediately after writing docs/tasks/${ISSUE_NUMBER}/task.md."
          ISSUE_CONTEXT=$(cat issue-context.txt)
          PROMPT="${STAGE_INSTRUCTION}

          ${ISSUE_CONTEXT}"
          # Write prompt to file to avoid shell escaping issues
          printf '%s' "$PROMPT" > copilot-prompt.txt

      - name: Run Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ACTION_TOKEN }}
        run: |
          copilot \
            --agent "$AGENT_FILE" \
            --prompt "$(cat copilot-prompt.txt)" \
            --model "$MODEL" \
            --allow-all \
            --no-ask-user \
            --silent \
            2>&1 | tee copilot-output.txt

      - name: Post CLI output as comment
        if: always()
        run: |
          if [ -f copilot-output.txt ] && [ -s copilot-output.txt ]; then
            # Truncate to 60000 chars to stay within GitHub comment limits
            OUTPUT=$(head -c 60000 copilot-output.txt)
            COMMENT="<details><summary>Copilot CLI Output (Design)</summary>

          \`\`\`
          ${OUTPUT}
          \`\`\`

          </details>"
            python scripts/comment_on_issue.py "$ISSUE_NUMBER" "$COMMENT" --repo "$REPO"
          fi

      - name: Verify output
        id: verify
        run: |
          OUTPUT_PATH="docs/tasks/${ISSUE_NUMBER}/${OUTPUT_FILE}"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "Error: Expected output file $OUTPUT_PATH was not created"
            python scripts/comment_on_issue.py "$ISSUE_NUMBER" "Stage Design failed: expected output file \`$OUTPUT_PATH\` was not created." --repo "$REPO"
            exit 1
          fi
          if git diff --quiet -- "$OUTPUT_PATH" 2>/dev/null && git diff --cached --quiet -- "$OUTPUT_PATH" 2>/dev/null; then
            # File exists but is not new and has no changes
            if git ls-files --error-unmatch "$OUTPUT_PATH" 2>/dev/null; then
              echo "Error: Output file $OUTPUT_PATH exists but has no changes"
              python scripts/comment_on_issue.py "$ISSUE_NUMBER" "Stage Design failed: output file \`$OUTPUT_PATH\` was not modified." --repo "$REPO"
              exit 1
            fi
          fi
          echo "Output file verified: $OUTPUT_PATH"

      - name: Commit and push
        run: |
          git add -A
          git commit -m "[Design] #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          git push origin "$STAGE_BRANCH"

      - name: Create PR
        run: |
          PR_TITLE="[Design] #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          PR_BODY="Stage: ${STAGE}
            Refs: #${ISSUE_NUMBER}

          Automated PR created by GitHub Copilot CLI for the design stage."
          python scripts/create_pr.py \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --head "$STAGE_BRANCH" \
            --base "$FEATURE_BRANCH" \
            --repo "$REPO"

      - name: Comment issue done
        run: |
          python scripts/comment_on_issue.py "$ISSUE_NUMBER" "Stage Design completed. PR created from branch \`${STAGE_BRANCH}\` into \`${FEATURE_BRANCH}\`." --repo "$REPO"
